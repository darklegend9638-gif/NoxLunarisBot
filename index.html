<style>
:root{--bg:#0a101c;--panel:#101a2b;--line:#1d2a42;--text:#e9eef7;--mut:#8d9bb3;--acc:#5ad1ff;--acc2:#a78bfa}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,#12233d 0,transparent 60%),var(--bg);color:var(--text);font:16px/1.55 Manrope,system-ui,"Segoe UI",Arial,sans-serif}
a{color:inherit;text-decoration:none}
body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#q,.row code,.ns{-webkit-user-select:text;user-select:text}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
nav{display:flex;align-items:center;gap:20px;padding:18px 0}
.logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:22px;letter-spacing:-.02em}
.ava{position:relative;width:46px;height:46px;flex:none}
.ava img{width:100%;height:100%;border-radius:14px;object-fit:cover;border:2px solid #2b4a78;box-shadow:0 0 0 1px #0a101c,0 6px 18px #5ad1ff22;display:block}
.ava i{position:absolute;right:-5px;bottom:-4px;width:13px;height:13px;border-radius:50%;background:#3de0a0;border:2px solid var(--bg)}.logo b{color:var(--acc)}
nav .sp{flex:1}
nav a.l{color:var(--mut);font-weight:600}nav a.l:hover{color:var(--text)}
.lang{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lang button{background:none;border:0;color:var(--mut);font:700 13px Manrope,sans-serif;padding:9px 12px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--acc);color:#04202e}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center;padding:56px 0 72px}
.st{display:inline-flex;gap:10px;align-items:center;color:var(--mut);font-weight:600;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;background:#3de0a0;box-shadow:0 0 0 4px #3de0a033}
h1{font-size:clamp(42px,6.6vw,84px);line-height:1;letter-spacing:-.035em;font-weight:800;margin:18px 0 22px}
h1 em{font-style:normal;color:var(--acc)}
.sub{color:var(--mut);font-size:19px;max-width:30em;margin:0 0 30px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{padding:15px 24px;border-radius:14px;font-weight:700;border:1px solid var(--line);background:transparent;color:var(--text)}
.btn.p{background:var(--acc);color:#04202e;border-color:var(--acc);box-shadow:0 10px 30px #5ad1ff44}
.chat{background:var(--panel);border:1px solid var(--line);border-radius:26px;overflow:hidden}
.chat header{padding:16px 22px;border-bottom:1px solid var(--line);color:var(--mut);font-size:14px}
.chat header b{color:var(--text);margin-right:8px}
.msgs{padding:22px;display:grid;gap:18px;min-height:330px;align-content:end}
.m{display:flex;gap:12px}
.av{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:#a78bfa;color:#1a1033}

.nm{font-weight:800}.tag{background:var(--acc);color:#04202e;font-size:11px;font-weight:800;border-radius:5px;padding:1px 6px;margin-left:6px}
.cmd{display:inline-block;background:#1a2740;border-radius:6px;padding:1px 8px;font-family:ui-monospace,Consolas,monospace}
.emb{margin-top:8px;background:#0c1626;border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:10px;padding:12px 16px;min-width:260px}
.emb b{display:block;margin-bottom:4px}.emb span{display:block;color:var(--mut)}
.ref{padding:24px 0 80px}
.ref h2{font-size:34px;letter-spacing:-.02em;margin:0 0 6px}
.note{color:var(--mut);margin:0 0 22px}
.tools{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}
#q{flex:1;min-width:220px;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:12px 16px;font:600 15px Manrope,sans-serif}
#q:focus,.chip:focus-visible,.lang button:focus-visible{outline:2px solid var(--acc)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:none;border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:9px 16px;font:700 14px Manrope,sans-serif;cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--acc);color:var(--acc);background:#5ad1ff14}
.grp{margin:30px 0 10px;font-size:20px}
.row{display:grid;grid-template-columns:minmax(200px,300px) 1fr;gap:20px;padding:14px 4px;border-bottom:1px solid var(--line)}
.row code{font:600 14px ui-monospace,Consolas,monospace;color:var(--acc);word-break:break-word}
.row p{margin:0;color:#c3cee0}
.ns{margin-top:6px;color:var(--mut);font-size:13px}
.ns span{font-weight:700;color:var(--text)}
.empty{color:var(--mut);padding:24px 0}
footer{border-top:1px solid var(--line);padding:26px 0 40px;color:var(--mut);font-size:14px}
@media(max-width:860px){.hero{grid-template-columns:1fr;padding-top:24px}.row{grid-template-columns:1fr;gap:4px}nav a.l{display:none}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
document.addEventListener("click", e => {
  const l = e.target.closest("[data-l]"), c = e.target.closest("[data-c]");
  if (l) { lang = l.dataset.l; try { localStorage.setItem("lang", lang); } catch(_){} render(); }
  if (c) { cat = c.dataset.c; render(); }
});
$("#q").addEventListener("input", render);
render();
</script>
